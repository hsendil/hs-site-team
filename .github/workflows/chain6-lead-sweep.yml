name: "Chain 6: Lead sweep"

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Yazma yapmadan raporla (1 = evet)"
        required: false
        default: "0"

concurrency:
  group: chain6-lead-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lead sweep
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_LEADS_PAGE: ${{ secrets.NOTION_LEADS_PAGE }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/lead-sweep.mjs
