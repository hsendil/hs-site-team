# Chain 7: Konu Onerici — UYKUDA (20.08.2026)
#
# DURUM: cron kaldirildi, zincir uykuda. Yalniz workflow_dispatch ile kosar.
#
# Gerekce: bu zincir Cumartesi slotu icin konu onerirdi (2 derin vaka +
# 3 saha notu). Cumartesi slotu 20.08.2026'da sahip karariyla kaldirildi.
# Kadans haftada tek Atifli Yorum'a indi. Zincir acik kalsaydi her
# Pazartesi karsiligi olmayan oneri uretip Issue listesini kirletecekti.
#
# Saha deneyimi ve PoC malzemesi kaybolmuyor, yeri degisiyor: artik ayri
# bir yazi slotu degil, Carsamba Atifli Yorum'unun "saha yorumu" katmani.
# Kural: CON.md -> Format tanimlari -> Atifli Yorum, saha yorumu katmani.
#
# GERI ACMAK: cron satirlarindaki yorumu kaldir. Cumartesi slotu geri
# gelmeden acma; uretilen oneri gidecek yer bulamaz.
#
# Gerekli secret: ANTHROPIC_API_KEY

name: 'Chain 7: Konu Onerici (uykuda)'

on:
  # Cumartesi slotu kaldirildigi icin cron 20.08.2026'da devre disi birakildi.
  # schedule:
  #   # Pazartesi 09:00 Europe/Istanbul (06:00 UTC)
  #   - cron: '0 6 * * 1'
  workflow_dispatch: {}

concurrency:
  group: chain7-konu-onerici
  cancel-in-progress: false

jobs:
  oner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Konu onerileri uret ve Issue ac
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/konu-onerici.mjs
