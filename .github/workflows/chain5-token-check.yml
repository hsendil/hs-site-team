# Chain 5c — LinkedIn Token Süre Takibi
#
# LinkedIn access token'ı 60 günde bir yenilenmeli. Sahip kararı gereği
# yenileme MANUEL yapılıyor; bu yüzden token'ın sessizce ölmesi en büyük
# operasyonel risk. Bu workflow haftada bir kontrol eder ve süre bitmeden
# GitHub Issue açar.
#
# Gerekli secrets: LINKEDIN_ACCESS_TOKEN, LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET

name: Chain 5c — LinkedIn Token Kontrol

on:
  schedule:
    # Her Pazartesi 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Token durumunu sorgula
        id: check
        env:
          TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${TOKEN:-}" ]; then
            echo "status=missing" >> "$GITHUB_OUTPUT"
            echo "days=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Önce introspection: kalan süreyi öğrenmenin tek kesin yolu
          RESP=$(curl -s -X POST \
            'https://www.linkedin.com/oauth/v2/introspectToken' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data-urlencode "client_id=${CLIENT_ID:-}" \
            --data-urlencode "client_secret=${CLIENT_SECRET:-}" \
            --data-urlencode "token=${TOKEN}" || echo '{}')

          echo "Introspection yanıtı: $(echo "$RESP" | head -c 300)"
          EXPIRES=$(echo "$RESP" | jq -r '.expires_at // empty')
          ACTIVE=$(echo "$RESP" | jq -r '.active // empty')

          if [ -n "$EXPIRES" ]; then
            NOW=$(date +%s)
            DAYS=$(( (EXPIRES - NOW) / 86400 ))
            echo "days=$DAYS" >> "$GITHUB_OUTPUT"
            if [ "$ACTIVE" = "false" ] || [ "$DAYS" -le 0 ]; then
              echo "status=expired" >> "$GITHUB_OUTPUT"
            elif [ "$DAYS" -le 10 ]; then
              echo "status=warning" >> "$GITHUB_OUTPUT"
            else
              echo "status=ok" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # Introspection kullanılamıyorsa canlılık testi yap
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${TOKEN}" \
            https://api.linkedin.com/v2/userinfo)
          echo "userinfo HTTP $CODE"
          echo "days=-1" >> "$GITHUB_OUTPUT"
          if [ "$CODE" = "200" ]; then
            echo "status=ok" >> "$GITHUB_OUTPUT"
          else
            echo "status=expired" >> "$GITHUB_OUTPUT"
          fi

      - name: Uyarı issue'su aç
        if: steps.check.outputs.status != 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.check.outputs.status }}
          DAYS: ${{ steps.check.outputs.days }}
        run: |
          set -euo pipefail
          TITLE="LinkedIn token yenilenmeli (durum: $STATUS)"

          # Aynı uyarı zaten açıksa tekrar açma
          EXISTING=$(gh issue list --state open --search "$TITLE in:title" --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Açık uyarı zaten var, yeni issue açılmadı."
            exit 0
          fi

          gh issue create --title "$TITLE" --body "Chain 5c otomatik kontrolü.

          **Durum:** \`$STATUS\`
          **Kalan gün:** $DAYS (-1 = introspection kullanılamadı, canlılık testi yapıldı)

          LinkedIn access token 60 gün ömürlüdür. Yenilenmezse Chain 5b yayın yapamaz.

          ## Yenileme (2 dakika)
          1. https://www.linkedin.com/developers/apps → uygulaman → **Auth** sekmesi
          2. **OAuth 2.0 tools** → *Create token*
          3. Scope seç: \`w_member_social\`, \`profile\`, \`openid\`
          4. Oluşan token'ı kopyala
          5. Repo → Settings → Secrets → **LINKEDIN_ACCESS_TOKEN** güncelle
          6. Chain 5b'yi \`dry_run: true\` ile çalıştırıp doğrula

          Yenileyince bu issue'yu kapat."
